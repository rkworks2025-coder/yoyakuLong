name: Manual Patrol Check

on:
  workflow_dispatch:
    inputs:
      pw_mode:
        description: 'TMAログインPWモード'
        required: true
        default: 'mode1'
        type: choice
        options:
          - mode1
          - mode2

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scrape Stage
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PW_MODE: ${{ github.event.inputs.pw_mode }}
          TMA_ID_1: ${{ secrets.TMA_ID_1 }}
          TMA_ID_2: ${{ secrets.TMA_ID_2 }}
          TMA_PW_MODE1: ${{ secrets.TMA_PW_MODE1 }}
          TMA_PW_MODE2: ${{ secrets.TMA_PW_MODE2 }}
          STAGE: scrape
          PYTHONUNBUFFERED: "1"
        run: |
          echo "$GCP_SA_KEY" > service_account.json
          python main.py

      - name: Upload collected data
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: collected_data.json
          retention-days: 1

  write:
    needs: scrape
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download collected data
        uses: actions/download-artifact@v4
        with:
          name: collected-data

      - name: Run Write Stage
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STAGE: write
          PYTHONUNBUFFERED: "1"
        run: |
          echo "$GCP_SA_KEY" > service_account.json
          python main.py
